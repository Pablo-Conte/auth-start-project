services:
    db_product_analyzer:
        image: postgres:16
        container_name: db_product_analyzer
        restart: unless-stopped
        volumes:
            - database:/var/lib/postgresql/data
        ports:
            - 5435:5432
        environment:
            POSTGRES_USER: test
            POSTGRES_PASSWORD: test
            POSTGRES_DB: test
            PGUSER: test
        healthcheck:
            test: ["CMD", "pg_isready"]
            interval: 10s
            timeout: 5s
            retries: 5
        logging:
            options:
                max-size: 10m
        networks:
            - product_analyzer_network

networks:
  product_analyzer_network:
    driver: bridge

volumes:
    database:
